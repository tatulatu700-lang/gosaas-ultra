name: GoSaaS-Ultra Production Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate_architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Isolate Source Code Matrix
        # Pin explicit v4/v5 tags that are fully compliant with Node 24 environments
        uses: actions/checkout@v4.2.2

      - name: Initialize Standard Go Environment
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.25.12' # Strictly maps to your autoupgraded project lockfile
          cache: true          # Enables native, non-breaking go.sum footprint caching

      - name: Synchronize Package Footprints
        run: go mod tidy

      - name: Hardened Static Compilation Audit
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -v -o gosaas_ultra_bin main.go

      - name: Validate Artifact Persistence
        run: test -f gosaas_ultra_bin
